[package]
name = "romforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
romforge-core = { workspace = true, features = ["controller"] }
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# uQ's theme: a watch on its state folder (`uq_tokens.rs`).
notify = { version = "8", default-features = false }

# The radial menu's overlay: GTK for its window, and gtk-layer-shell
# opened at run time (`overlay.rs`), so romforge starts without it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.7"
# Whether a tray (a StatusNotifier watcher) is on the session bus; the
# version and features Tauri's opener already brings.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
