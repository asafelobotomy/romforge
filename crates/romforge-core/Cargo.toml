[package]
name = "romforge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Game pads (gilrs: evdev and libudev on Linux), for the app's controller
# mode; the CLI does without.
controller = ["dep:gilrs"]

[dependencies]
gilrs = { version = "0.11", optional = true }
crc32fast = "1"
md-5 = "0.11"
sha1 = "0.11"
quick-xml = "0.42"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint", "functions"] }
serde.workspace = true
serde_json.workspace = true
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
sha2 = "0.11"
thiserror = "2"
walkdir = "2"
# Free space before moving game data into RomForge (milestone 20).
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "ppmd"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# Writing Z3DS, WUA and RVZ (milestone 23); ruzstd reads.
zstd = { version = "0.14", default-features = false }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }
chd = { version = "0.4", default-features = false, features = ["std", "want_raw_data_sector", "encode"] }
shiratsu-naming = "1.1"
strsim = "0.11"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
oxidelta = { version = "0.1.4", default-features = false, features = ["adler32", "lzma-secondary"] }

# Asking an emulator to quit (SIGTERM) before stopping it hard (unix), and
# renaming without replacing (renameat2, Linux).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
