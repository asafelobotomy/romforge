# The Game library page of uQ Settings: a look at what romforge has found, with a button that opens
# romforge for everything else. Installed by the romforge packages to
# /usr/share/uq/settings/pages/romforge/. It reads through `romforge-cli`; the one thing it changes
# is the "Check downloads with oysterAV" setting. See uq/README.md.
uq_api = 3
id = "romforge"
name = "Game library"
icon = "applications-games"
qml = "Page.qml"
keywords = ["romforge", "roms", "games", "retro", "emulator", "library", "bios", "collection", "platforms"]

[requires]
bins = ["romforge-cli"]

[[setting]]
id = "library"
label = "Your library"
keywords = ["games", "total", "verified", "size", "collection"]

[[setting]]
id = "platforms"
label = "Games by platform"
keywords = ["systems", "consoles", "nes", "snes", "count"]

[[setting]]
id = "recent"
label = "Recently added"
keywords = ["new", "latest", "scanned"]

[[setting]]
id = "folders"
label = "Folders"
keywords = ["source", "library folder", "romforge folder", "path"]

[[setting]]
id = "browse"
label = "Browse games"
keywords = ["search", "filter", "sort", "list", "find"]

[[setting]]
id = "bios"
label = "BIOS files"
keywords = ["firmware", "missing", "emulator", "required"]

[[setting]]
id = "oysterav"
label = "Check with oysterAV"
keywords = ["antivirus", "virus", "malware", "scan", "security", "threat", "downloads", "emulators"]

[[setting]]
id = "lists"
label = "Game lists"
keywords = ["dat", "no-intro", "redump", "identify", "missing"]

# What romforge holds. Read again after a change to its library file.
[[command]]
id = "overview"
argv = ["/usr/bin/romforge-cli", "overview", "--json"]
output = "json"
timeout_ms = 60000
watch = { files = ["~/.local/share/romforge/romforge.db"] }

# The list of games: platform, status, sort, how many, how many to skip, then the words to
# search for (`*`: any title). The patterns are the same as logic.js's (tests/uq checks it).
[[command]]
id = "browse"
argv = ["/usr/bin/romforge-cli", "browse"]
output = "json"
timeout_ms = 60000
args = [{ name = "platform", pattern = "^(all|[A-Za-z0-9][A-Za-z0-9 '.-]{0,39})$" }, { name = "status", pattern = "^(all|verified|incomplete|unidentified)$" }, { name = "sort", pattern = "^(title|platform|year|status)(:desc)?$" }, { name = "limit", pattern = "^[0-9]{1,4}$" }, { name = "offset", pattern = "^[0-9]{1,7}$" }, { name = "search", pattern = "^[^\\x00-\\x1f\\x7f-][^\\x00-\\x1f\\x7f]{0,79}$" }]

# ---- oysterAV. Streamed: a line as each place is looked at. It only looks: nothing is moved or deleted.
[[command]]
id = "oysterav-all"
argv = ["/usr/bin/romforge-cli", "oysterav", "--ndjson"]
output = "ndjson"
timeout_ms = 3600000

[[command]]
id = "oysterav"
argv = ["/usr/bin/romforge-cli", "oysterav", "--ndjson"]
output = "ndjson"
timeout_ms = 3600000
args = [{ name = "target", pattern = "^(emulators|games)$" }]

# Whether a download is looked at before it is put in place (the app's Settings has the same switch).
[[command]]
id = "scan-setting"
argv = ["/usr/bin/romforge-cli", "settings", "--scan-downloads"]
output = "text"
timeout_ms = 30000
args = [{ name = "value", pattern = "^(true|false)$" }]
