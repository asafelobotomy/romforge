name: Release
# Milestone 15: a new version builds the packages and attaches them, with
# SHA-256 checksums, to a GitHub release: .deb, .rpm, AppImage, the CLI on
# its own, and the AUR's PKGBUILD for romforge-bin (pushed to the AUR by
# hand: `makepkg --printsrcinfo`).
#
# A version bump pushed to main is enough: when the workspace version has
# no tag yet, this tags that commit vX.Y.Z and releases it. Pushing a tag
# by hand still works the same. (A tag made here with the workflow's own
# token starts no second run.)
on:
  push:
    branches: [main]
    # Only a push that may change the version (the version files, or this
    # workflow) is looked at; tag pushes always are.
    paths:
      - Cargo.toml
      - app/package.json
      - app/src-tauri/tauri.conf.json
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a run is never cut off halfway through uploading.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: The version, and whether it is released yet
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            release=true
          else
            v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            [ -n "$v" ] || { echo "no version in Cargo.toml"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              echo "v$v is tagged already: nothing to release"
              release=false
            else
              release=true
            fi
          fi
          grep -q "^version = \"$v\"" Cargo.toml || { echo "Cargo.toml isn't $v"; exit 1; }
          grep -q "\"version\": \"$v\"" app/src-tauri/tauri.conf.json || { echo "tauri.conf.json isn't $v"; exit 1; }
          grep -q "\"version\": \"$v\"" app/package.json || { echo "app/package.json isn't $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  packages:
    needs: version
    if: needs.version.outputs.release == 'true'
    # The oldest supported Ubuntu: its glibc is older than every target's.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - run: npm ci
        working-directory: app
      # The app crate embeds the built web UI, so build it before testing.
      - run: npm run build
        working-directory: app
      - run: cargo test --workspace --locked
      - name: Build the packages (the CLI is built first, by beforeBuildCommand)
        working-directory: app
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build
      - name: Collect them
        run: |
          mkdir out
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage out/
          tar -czf "out/romforge-cli-$VERSION-x86_64-linux.tar.gz" -C target/release romforge-cli -C "$GITHUB_WORKSPACE" LICENSE README.md GUIDE.md
          deb="romforge_${VERSION}_amd64.deb"
          test -f "out/$deb"
          sum=$(sha256sum "out/$deb" | cut -d' ' -f1)
          cat > out/PKGBUILD <<EOF
          # Maintainer: asafelobotomy <https://github.com/asafelobotomy>
          pkgname=romforge-bin
          pkgver=$VERSION
          pkgrel=1
          pkgdesc="Identify, tidy and play your ROM collection"
          arch=('x86_64')
          url="https://github.com/asafelobotomy/romforge"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'glib2' 'libsoup3' 'cairo' 'gdk-pixbuf2' 'dbus'
                   'hicolor-icon-theme' 'glibc' 'libgcc' 'systemd-libs' 'libayatana-appindicator')
          optdepends=('retroarch: play games (with its cores)'
                      'libretro-scummvm: ScummVM games in RetroArch'
                      'scummvm: ScummVM games, and naming them'
                      'mame: Arcade, FM-7 and FM Towns games'
                      'flatpak: DOSBox Staging or DOSBox-X from Flathub'
                      'gtk-layer-shell: the radial menu over a fullscreen game'
                      'gst-plugins-good: music in the fullscreen mode (MP3, FLAC, WAV)'
                      'gst-libav: music in M4A/AAC')
          provides=('romforge')
          conflicts=('romforge')
          source=("\$pkgname-\$pkgver.deb::https://github.com/asafelobotomy/romforge/releases/download/v\$pkgver/romforge_\${pkgver}_amd64.deb"
                  "LICENSE-\$pkgver::https://raw.githubusercontent.com/asafelobotomy/romforge/v\$pkgver/LICENSE")
          sha256sums=('$sum'
                      '$(sha256sum LICENSE | cut -d' ' -f1)')

          package() {
            bsdtar -xf data.tar.* -C "\$pkgdir"
            install -Dm644 "LICENSE-\$pkgver" "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
          }
          EOF
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # From main, this makes the tag, on the commit that was built.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "romforge $VERSION" --generate-notes
          gh release upload "$TAG" out/* --clobber
