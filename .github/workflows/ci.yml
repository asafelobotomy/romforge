name: CI
on:
  push:
  pull_request:

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Advisories aren't checked: unmaintained crates Tauri pulls in (GTK 3
      # bindings, zbus) fail them with no upgrade to take.
      - name: Licences (house rule 9) and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans
      - name: Quick start from the guide
        run: |
          export ROMFORGE_DB="$RUNNER_TEMP/quickstart.db"
          cargo run -q -p romforge-cli -- dat import fixtures/dats/*.dat
          cargo run -q -p romforge-cli -- scan fixtures/ | tee scan.txt
          grep -q '^matched .*Test NES' scan.txt

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      # The fullscreen mode's focus moves (Node's own test runner).
      - run: node --test "test/*.test.mjs"
        working-directory: app
      - run: cargo clippy -p romforge-app --all-targets -- -D warnings
      - run: cargo test -p romforge-app
      - run: npx tauri build --no-bundle
        working-directory: app
