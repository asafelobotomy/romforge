name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request stops the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      # romforge-provider reads the pad for the hotkeys (gilrs: libudev).
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # romforge-provider's tests run its D-Bus interface on a private bus.
      - run: command -v dbus-daemon || (sudo apt-get update && sudo apt-get install -y dbus-daemon)
      # MAME's chdman, which tests/psp_chd_format.rs checks a PSP CHD with
      # (it is skipped where chdman is missing).
      - run: sudo apt-get update && sudo apt-get install -y mame-tools
      # --locked: a Cargo.lock that doesn't fit Cargo.toml fails here.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Licences (house rule 9), bans, sources and advisories; the
      # unmaintained crates Tauri pulls in with no upgrade are named, with
      # why, in deny.toml.
      - name: Licences, bans, sources and advisories
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check
      - name: Quick start from the guide
        run: |
          export ROMFORGE_DB="$RUNNER_TEMP/quickstart.db"
          cargo run -q -p romforge-cli -- dat import fixtures/dats/*.dat
          cargo run -q -p romforge-cli -- scan fixtures/ | tee scan.txt
          grep -q '^matched .*Test NES' scan.txt

  # The oldest Rust Cargo.toml says it builds with (`rust-version`).
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo check --locked --all-targets

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      # The vendored uq-tokens is the version pinned here (uQ's theme).
      - run: scripts/check-uq-tokens.sh 1.0.0 app/src/vendor/uq-tokens/uq-tokens.js
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      # The fullscreen mode's focus moves and uQ's colours (Node's own test
      # runner).
      - run: node --test "test/*.test.mjs"
        working-directory: app
      - run: cargo clippy --locked -p romforge-app --all-targets -- -D warnings
      - run: cargo test --locked -p romforge-app
      - run: npx tauri build --no-bundle
        working-directory: app

  # The Game library page of uQ Settings (uq/pages/romforge/): its Node and QML tests, and uqctl's
  # own check of the uq/ folder.
  uq:
    name: uQ Settings page
    runs-on: ubuntu-24.04
    env:
      # The uQ release whose `uqctl` checks the uq/ folder (its Phase 4 checks included).
      UQ_TAG: v0.3.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qttest qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Page logic and manifest tests (Node)
        run: node --test 'tests/uq/*.test.mjs'
      # QML_XHR_ALLOW_FILE_READ lets the page tests read tests/uq/fixtures/.
      - name: Page tests (QML, offscreen)
        run: QML_XHR_ALLOW_FILE_READ=1 QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"
      # `--no-programs` skips only the "program exists" check: romforge isn't installed here.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/
