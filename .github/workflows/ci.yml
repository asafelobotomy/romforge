name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request stops the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      # romforge-provider's tests run its D-Bus interface on a private bus.
      - run: command -v dbus-daemon || (sudo apt-get update && sudo apt-get install -y dbus-daemon)
      # --locked: a Cargo.lock that doesn't fit Cargo.toml fails here.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Licences (house rule 9), bans, sources and advisories; the
      # unmaintained crates Tauri pulls in with no upgrade are named, with
      # why, in deny.toml.
      - name: Licences, bans, sources and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - name: Quick start from the guide
        run: |
          export ROMFORGE_DB="$RUNNER_TEMP/quickstart.db"
          cargo run -q -p romforge-cli -- dat import fixtures/dats/*.dat
          cargo run -q -p romforge-cli -- scan fixtures/ | tee scan.txt
          grep -q '^matched .*Test NES' scan.txt

  # The oldest Rust Cargo.toml says it builds with (`rust-version`).
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --all-targets

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      # The vendored uq-tokens is the version pinned here (uQ's theme).
      - run: scripts/check-uq-tokens.sh 1.0.0 app/src/vendor/uq-tokens/uq-tokens.js
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      # The fullscreen mode's focus moves and uQ's colours (Node's own test
      # runner).
      - run: node --test "test/*.test.mjs"
        working-directory: app
      - run: cargo clippy --locked -p romforge-app --all-targets -- -D warnings
      - run: cargo test --locked -p romforge-app
      - run: npx tauri build --no-bundle
        working-directory: app
