name: CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Advisories aren't checked: unmaintained crates Tauri pulls in (GTK 3
      # bindings, zbus) fail them with no upgrade to take.
      - name: Licences (house rule 9) and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
      - name: Quick start from the guide
        run: |
          export ROMFORGE_DB="$RUNNER_TEMP/quickstart.db"
          cargo run -q -p romforge-cli -- dat import fixtures/dats/*.dat
          cargo run -q -p romforge-cli -- scan fixtures/ | tee scan.txt
          grep -q '^matched .*Test NES' scan.txt

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      # The fullscreen mode's focus moves (Node's own test runner).
      - run: node --test "test/*.test.mjs"
        working-directory: app
      - run: cargo clippy -p romforge-app --all-targets -- -D warnings
      - run: cargo test -p romforge-app
      - run: npx tauri build --no-bundle
        working-directory: app
